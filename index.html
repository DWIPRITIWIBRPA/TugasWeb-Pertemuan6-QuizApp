<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <main class="quiz-container">
        <h1>Interactive Quiz</h1>

        <section id="quiz-screen" class="quiz-screen">
            <p id="question-number"></p>

            <h2 id="question"></h2>

            <div id="answers" class="answers"></div>

            <button id="next-button" type="button">Soal Berikutnya</button>
        </section>

        <section id="result-screen" class="result-screen" hidden>
            <h2>Quiz Selesai</h2>

            <p id="score"></p>
            <p id="high-score"></p>

            <button id="restart-button" type="button">Restart Quiz</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
